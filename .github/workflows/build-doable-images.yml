# ==============================================================================
# Build all four Doable runtime images entirely on GitHub-hosted runners.
#
# Purpose: produce ready-to-run images so a local machine never runs a
# multi-stage pnpm/Next.js build. Every heavy step (pnpm install over the full
# Activepieces dependency graph, Next.js production build, Chromium install)
# happens here and nowhere else.
#
# Outputs (pushed to GHCR):
#   ghcr.io/<owner>/doable-api:<tag>       + :latest
#   ghcr.io/<owner>/doable-ws:<tag>        + :latest
#   ghcr.io/<owner>/doable-web:<tag>       + :latest
#   ghcr.io/<owner>/doable-migrate:<tag>   + :latest
#
# plus zstd-compressed `docker save` artifacts as a registry-free install path.
#
# Design notes:
#   - ONE `docker buildx bake` solve for all four targets, so the shared `deps`
#     and `build` stages are materialised exactly once. The upstream matrix
#     variant repeats them four times.
#   - Disk reclamation first: ubuntu-latest ships ~14 GB free and the full
#     monorepo node_modules + Chromium + .next output does not fit.
#   - `mode=min` cache export keeps the gha cache within the per-repo limit.
#   - The web image is built WITHOUT NEXT_PUBLIC_* build args so the client
#     bundle keeps the __DOABLE_*_URL__ placeholders and the runtime entrypoint
#     rewrites them for any local origin.
#   - Images are exported one at a time and removed from the local store
#     afterwards, so the daemon never holds several multi-GB images at once.
# ==============================================================================

name: Build Doable images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: <date>-<short sha>)"
        required: false
        default: ""
      export_tarballs:
        description: "Also upload docker-save tarball artifacts (registry-free install)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-doable-images.yml"
      - "deployment/docker/Dockerfile"
      - "pnpm-lock.yaml"
      - "apps/web/package.json"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: doable-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Reclaim runner disk
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/chromedriver-linux64 || true
          sudo apt-get clean
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          SHA_SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          INPUT_TAG="${{ inputs.tag }}"
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(date -u +%Y%m%d)-${SHA_SHORT}"
          fi
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prefix=${REGISTRY}/${OWNER_LC}/doable" >> "$GITHUB_OUTPUT"
          echo "Building owner=${OWNER_LC} tag=${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 8

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push all targets (single bake solve)
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          # Generate the bake definition at run time: BuildKit's JSON bake
          # parser rejects un-declared variables, and declaring them statically
          # in the repo would pin one namespace. A plain heredoc keeps the
          # shared `deps`/`build` stages in a single solve so pnpm install and
          # `next build` each run exactly once for all four targets.
          cat > "${RUNNER_TEMP}/doable.bake.json" <<JSON
          {
            "group": {
              "doable": { "targets": ["migrate", "api", "ws", "web"] }
            },
            "target": {
              "doable-common": {
                "context": ".",
                "dockerfile": "deployment/docker/Dockerfile",
                "platforms": ["linux/amd64"]
              },
              "migrate": {
                "inherits": ["doable-common"],
                "target": "migrate",
                "tags": ["${PREFIX}-migrate:${TAG}", "${PREFIX}-migrate:latest"],
                "cache-from": ["type=gha,scope=doable-deps", "type=gha,scope=doable-migrate"],
                "cache-to": ["type=gha,mode=min,scope=doable-migrate"]
              },
              "api": {
                "inherits": ["doable-common"],
                "target": "api",
                "tags": ["${PREFIX}-api:${TAG}", "${PREFIX}-api:latest"],
                "cache-from": ["type=gha,scope=doable-deps", "type=gha,scope=doable-api"],
                "cache-to": ["type=gha,mode=min,scope=doable-api"]
              },
              "ws": {
                "inherits": ["doable-common"],
                "target": "ws",
                "tags": ["${PREFIX}-ws:${TAG}", "${PREFIX}-ws:latest"],
                "cache-from": ["type=gha,scope=doable-deps", "type=gha,scope=doable-ws"],
                "cache-to": ["type=gha,mode=min,scope=doable-ws"]
              },
              "web": {
                "inherits": ["doable-common"],
                "target": "web",
                "tags": ["${PREFIX}-web:${TAG}", "${PREFIX}-web:latest"],
                "cache-from": ["type=gha,scope=doable-deps", "type=gha,scope=doable-web"],
                "cache-to": ["type=gha,mode=min,scope=doable-web"]
              }
            }
          }
          JSON

          echo "--- generated bake file ---"
          cat "${RUNNER_TEMP}/doable.bake.json"

          docker buildx bake \
            --file "${RUNNER_TEMP}/doable.bake.json" \
            --push \
            doable

          df -h /

      - name: Report pushed manifests
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Doable images built"
            echo ""
            echo "Tag: \`${TAG}\`"
            echo ""
            echo "| Service | Reference | Digest |"
            echo "| --- | --- | --- |"
            for t in migrate api ws web; do
              REF="${PREFIX}-${t}:${TAG}"
              DIGEST="$(docker buildx imagetools inspect "${REF}" --format '{{json .Manifest.Digest}}' 2>/dev/null || echo unknown)"
              echo "| ${t} | \`${REF}\` | ${DIGEST} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attempt to make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for t in migrate api ws web; do
            echo "--- doable-$t ---"
            gh api --method PATCH "/user/packages/container/doable-$t" -f visibility=public 2>&1 | head -c 1200 || true
            echo
          done

      - name: Verify anonymous pullability
        continue-on-error: true
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -uo pipefail
          docker logout "${REGISTRY}" || true
          for t in migrate api ws web; do
            REF="${PREFIX}-${t}:${TAG}"
            REPO_PATH="${REF#${REGISTRY}/}"
            REPO_PATH="${REPO_PATH%%:*}"
            TOKEN="$(curl -fsS "https://${REGISTRY}/token?scope=repository:${REPO_PATH}:pull&service=${REGISTRY}" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
            CODE="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://${REGISTRY}/v2/${REPO_PATH}/manifests/${TAG}")"
            echo "${t}: anonymous manifest GET -> HTTP ${CODE}"
          done
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Export docker-save tarballs (registry-free fallback)
        if: ${{ inputs.export_tarballs == 'true' || inputs.export_tarballs == null }}
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
          OUTDIR="${RUNNER_TEMP}/imgs"
          mkdir -p "${OUTDIR}"
          for t in migrate api ws web; do
            REF="${PREFIX}-${t}:${TAG}"
            echo "=== ${t} ==="
            df -h / | tail -1
            docker pull "${REF}"
            SIZE="$(docker image inspect "${REF}" --format '{{.Size}}')"
            echo "uncompressed bytes: ${SIZE}"
            docker save "${REF}" | zstd -T0 -6 -q -o "${OUTDIR}/doable-${t}-${TAG}.tar.zst"
            docker image rm -f "${REF}" || true
            ls -lh "${OUTDIR}"
            # keep every uploaded asset under the per-asset ceiling
            split -b 1900M -d -a 3 "${OUTDIR}/doable-${t}-${TAG}.tar.zst" "${OUTDIR}/doable-${t}-${TAG}.tar.zst.part-"
            rm -f "${OUTDIR}/doable-${t}-${TAG}.tar.zst"
          done
          ls -lh "${OUTDIR}"

      - name: Upload image artifacts
        if: ${{ inputs.export_tarballs == 'true' || inputs.export_tarballs == null }}
        uses: actions/upload-artifact@v4
        with:
          name: doable-images-${{ steps.meta.outputs.tag }}
          path: ${{ runner.temp }}/imgs/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Summary of artifacts
        if: ${{ inputs.export_tarballs == 'true' || inputs.export_tarballs == null }}
        run: |
          {
            echo ""
            echo "### Tarball artifacts"
            echo ""
            echo "Download \`doable-images-${{ steps.meta.outputs.tag }}\` from the run page, then:"
            echo ""
            echo '```bash'
            echo "cat doable-api-*.part-* > doable-api.tar.zst && zstd -d doable-api.tar.zst"
            echo "docker load -i doable-api.tar"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
